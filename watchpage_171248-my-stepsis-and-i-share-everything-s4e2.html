    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1a1a2e;
        }

        .turnstile-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
            padding: 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .turnstile-card h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .turnstile-card p {
            font-size: 14px;
            color: #555;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .turnstile-checkbox-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            user-select: none;
            margin-bottom: 16px;
        }

        .turnstile-checkbox-wrapper:hover {
            border-color: #b0b0b0;
            background: #fafafa;
        }

        .turnstile-checkbox-wrapper {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .turnstile-checkbox-wrapper.turnstile-processing {
            border-color: #4a90d9;
            background: #f0f6ff;
            cursor: wait;
        }

        .turnstile-checkbox-wrapper.turnstile-success {
            border-color: #34a853;
            background: #f0faf3;
            cursor: default;
        }

        .turnstile-checkbox-wrapper.turnstile-error {
            border-color: #ea4335;
            background: #fef0ef;
            cursor: pointer;
        }

        .turnstile-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #ccc;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: border-color 0.2s, background 0.2s;
        }

        .turnstile-processing .turnstile-checkbox {
            border-color: #4a90d9;
        }

        .turnstile-success .turnstile-checkbox {
            border-color: #34a853;
            background: #34a853;
        }

        .turnstile-error .turnstile-checkbox {
            border-color: #ea4335;
        }

        .turnstile-checkmark {
            display: none;
            color: #fff;
            font-size: 16px;
            line-height: 1;
        }

        .turnstile-success .turnstile-checkmark {
            display: block;
        }

        .turnstile-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #4a90d9;
            border-top-color: transparent;
            border-radius: 50%;
            animation: turnstileSpin 0.8s linear infinite;
        }

        .turnstile-processing .turnstile-spinner {
            display: block;
        }

        .turnstile-label {
            font-size: 15px;
            font-weight: 500;
        }

        .turnstile-status {
            font-size: 13px;
            color: #888;
            min-height: 20px;
        }

        .turnstile-error .turnstile-status,
        .turnstile-status.turnstile-status-error {
            color: #ea4335;
        }

        .turnstile-success .turnstile-status {
            color: #34a853;
        }

        @keyframes turnstileSpin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

        <div class="turnstile-status" id="turnstileStatus"></div>

    <script>
    (function() {
        var wrapper = document.getElementById('turnstileCheckboxWrapper');
        var statusElement = document.getElementById('turnstileStatus');
        var isProcessing = false;
        var isComplete = false;

        function setState(state, message) {
            wrapper.className = 'turnstile-checkbox-wrapper';
            if (state) {
                wrapper.classList.add('turnstile-' + state);
            }
            statusElement.textContent = message || '';
            statusElement.className = 'turnstile-status';
            if (state === 'error') {
                statusElement.classList.add('turnstile-status-error');
            }
        }

        function collectEnvironmentChecks() {
            var checks = {
                screenWidth: screen.width,
                screenHeight: screen.height,
                hasCanvas: false,
                hasWebGL: false,
                colorDepth: screen.colorDepth || 0,
                timezoneOffset: new Date().getTimezoneOffset(),
                languages: (navigator.languages || [navigator.language || '']).join(','),
                platform: navigator.platform || '',
                cookieEnabled: navigator.cookieEnabled
            };

            // Canvas test
            try {
                var canvasElement = document.createElement('canvas');
                var canvasContext = canvasElement.getContext('2d');
                if (canvasContext) {
                    canvasContext.fillText('test', 10, 10);
                    checks.hasCanvas = true;
                }
            } catch (canvasError) {
                checks.hasCanvas = false;
            }

            // WebGL test
            try {
                var glCanvas = document.createElement('canvas');
                var glContext = glCanvas.getContext('webgl') || glCanvas.getContext('experimental-webgl');
                checks.hasWebGL = !!glContext;
            } catch (glError) {
                checks.hasWebGL = false;
            }

            return checks;
        }

        function solveProofOfWork(challenge, difficulty) {
            return new Promise(function(resolve, reject) {
                var workerCode = '(' + function() {
                    self.onmessage = function(event) {
                        var challengeStr = event.data.challenge;
                        var difficultyBits = event.data.difficulty;
                        var currentNonce = 0;

                        function tryNonces() {
                            var promises = [];
                            for (var idx = 0; idx < 1000; idx++) {
                                var textEncoder = new TextEncoder();
                                var data = textEncoder.encode(challengeStr + ':' + currentNonce);
                                promises.push(
                                    (function(nonceValue) {
                                        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(challengeStr + ':' + nonceValue))
                                            .then(function(hashBuffer) {
                                                return { nonce: nonceValue, hash: hashBuffer };
                                            });
                                    })(currentNonce)
                                );
                                currentNonce++;
                            }

                            Promise.all(promises).then(function(results) {
                                for (var resultIdx = 0; resultIdx < results.length; resultIdx++) {
                                    var result = results[resultIdx];
                                    var hashArray = new Uint8Array(result.hash);
                                    if (checkLeadingZeroBits(hashArray, difficultyBits)) {
                                        self.postMessage({ type: 'solved', nonce: String(result.nonce) });
                                        return;
                                    }
                                }
                                self.postMessage({ type: 'progress', tested: currentNonce });
                                tryNonces();
                            }).catch(function(error) {
                                self.postMessage({ type: 'error', message: error.message });
                            });
                        }

                        function checkLeadingZeroBits(byteArray, requiredBits) {
                            var bitsChecked = 0;
                            for (var byteIndex = 0; byteIndex < byteArray.length && bitsChecked < requiredBits; byteIndex++) {
                                var currentByte = byteArray[byteIndex];
                                for (var bitPosition = 7; bitPosition >= 0 && bitsChecked < requiredBits; bitPosition--) {
                                    if ((currentByte >> bitPosition) & 1) {
                                        return false;
                                    }
                                    bitsChecked++;
                                }
                            }
                            return true;
                        }

                        tryNonces();
                    };
                }.toString() + ')();';

                var workerBlob = new Blob([workerCode], { type: 'application/javascript' });
                var workerUrl = URL.createObjectURL(workerBlob);
                var powWorker = new Worker(workerUrl);

                powWorker.onmessage = function(event) {
                    if (event.data.type === 'solved') {
                        powWorker.terminate();
                        URL.revokeObjectURL(workerUrl);
                        resolve(event.data.nonce);
                    } else if (event.data.type === 'error') {
                        powWorker.terminate();
                        URL.revokeObjectURL(workerUrl);
                        reject(new Error(event.data.message));
                    }
                    // 'progress' messages are ignored (could update UI if desired)
                };

                powWorker.onerror = function(error) {
                    powWorker.terminate();
                    URL.revokeObjectURL(workerUrl);
                    reject(error);
                };

                powWorker.postMessage({
                    challenge: challenge,
                    difficulty: difficulty
                });
            });
        }

        function submitVerification(nonce, environmentChecks) {
            return fetch('/turnstile/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nonce: nonce,
                    timestamp: turnstileConfig.timestamp,
                    difficulty: turnstileConfig.difficulty,
                    environmentChecks: environmentChecks,
                    returnTo: turnstileConfig.returnTo
                })
            }).then(function(response) {
                return response.json();
            });
        }

        function startChallenge() {
            if (isProcessing || isComplete) return;
            isProcessing = true;

            setState('processing', 'Verifying\u2026');

            var environmentChecks = collectEnvironmentChecks();

            solveProofOfWork(turnstileConfig.challenge, turnstileConfig.difficulty)
                .then(function(nonce) {
                    setState('processing', 'Almost done\u2026');
                    return submitVerification(nonce, environmentChecks);
                })
                .then(function(result) {
                    if (result.success) {
                        isComplete = true;
                        setState('success', 'Verified! Redirecting\u2026');
                        setTimeout(function() {
                            window.location.href = result.redirectTo;
                        }, 500);
                    } else {
                        isProcessing = false;
                        setState('error', result.error || 'Verification failed. Click to retry.');
                    }
                })
                .catch(function(error) {
                    isProcessing = false;
                    setState('error', 'Something went wrong. Click to retry.');
                });
        }

        wrapper.addEventListener('click', startChallenge);
        wrapper.addEventListener('touchend', function(touchEvent) {
            touchEvent.preventDefault();
            startChallenge();
        });
        wrapper.addEventListener('keydown', function(keyEvent) {
            if (keyEvent.key === 'Enter' || keyEvent.key === ' ') {
                keyEvent.preventDefault();
                startChallenge();
